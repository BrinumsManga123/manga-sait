<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manga atdzime</title>
  <style>
   body {
  margin: 0;
  display: flex;
  font-family: sans-serif;
  background-image: url('https://th.bing.com/th/id/R.d3a6edda76833bbba2b9a8bd95e188f1?rik=s4I%2bvRQd5PykAw&pid=ImgRaw&r=0');
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-position: center;
    .sidebar {
      width: 200px;
      background-color: #c7f28d;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar button {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: #a4f28a;
      cursor: pointer;
    }

    .sidebar button:hover {
      background-color: #91dd7c;
    }

    .main {
      flex-grow: 1;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    form {
      margin-bottom: 30px;
      background: #ffffff66;
      padding: 15px;
      border-radius: 15px;
    }

    input, textarea, select {
      display: block;
      margin-bottom: 10px;
      padding: 10px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .card {
      background-color: #a4f28a;
      border-radius: 20px;
      padding: 20px;
      max-width: 500px;
      margin-bottom: 20px;
      position: relative;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: -20px;
      left: 40px;
      width: 0;
      height: 0;
      border: 20px solid transparent;
      border-top-color: #a4f28a;
      border-bottom: 0;
      margin-left: -20px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="filterCards('all')">Visi</button>
    <button onclick="filterCards('isekai')">fentizi</button>
    <button onclick="filterCards('romance')">Romantika</button>
    <button onclick="filterCards('school')">Skola</button>
    <button onclick="filterCards('war')">Militārs</button>
  </div>

  <div class="main">
    <h1>Manga atdzime</h1>

    <form id="reviewForm">
      <input type="text" id="title" placeholder="Nosaukums mangas" required />
      <textarea id="description" placeholder="Apraksts" required></textarea>
      <input type="text" id="rating" placeholder="Vērtējums (piemēram, 9/10)" required />
      <select id="genre">
        <option value="isekai">fentizi</option>
        <option value="romance">Romantika</option>
        <option value="school">Skola</option>
        <option value="war">Militārs</option>
      </select>
      <button type="submit">Pievienot atsauksmi</button>
    </form>

    <div id="cardContainer">
      <!-- Šeit būs kartītes -->
    </div>
  </div>

  <script>
    const form = document.getElementById('reviewForm');
    const cardContainer = document.getElementById('cardContainer');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const rating = document.getElementById('rating').value;
      const genre = document.getElementById('genre').value;

      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-genre', genre);
      card.innerHTML = `<strong>${title}</strong><br>${description}<br>Vērtējums: ${rating}`;
      cardContainer.appendChild(card);

      form.reset();
    });

    function filterCards(genre) {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        if (genre === 'all' || card.dataset.genre.includes(genre)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
